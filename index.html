<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">

<title>入口アプリ</title>

<style>
  body {
    font-family:
      "Hiragino Maru Gothic ProN",
      "Yu Gothic",
      "Noto Sans JP",
      sans-serif;
    font-size: 30px;   /* ★ 全体の基本フォントサイズを大きめに */
  }

  /* ダイアログ内の文字をさらに少し大きく */
  #noticeDialog p {
    font-size: 30px;
  }

  /* ボタンも見やすく */
  button {
    font-size: 30px;
  }
</style>


</head>

<body>

<!-- 初回だけ表示する案内UI -->
<div id="installPrompt" style="
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9998;
">
  <div style="
    background: white;
    padding: 20px;
    border-radius: 12px;
    width: 80%;
    max-width: 320px;
    text-align: center;
    font-size: 18px;
  ">
    <p>このアプリをホーム画面に追加できます。</p>
    <button id="okButton" style="
      padding: 10px 20px;
      font-size: 18px;
      border-radius: 8px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    ">OK</button>
  </div>
</div>

<!-- ホーム画面追加の説明 -->
<div id="howToAdd" style="
  display: none;
  padding: 20px;
  font-size: 18px;
  text-align: center;
">
  <p>この状態でホーム画面に追加できます</p>
  <p>追加したら一旦閉じてアイコンの出来上がりです</p>
</div>

<!-- 注意事項ダイアログ -->
<div id="noticeDialog" style="
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
">
  <div style="
    background: white;
    padding: 20px;
    border-radius: 12px;
    width: 85%;
    max-width: 340px;
    text-align: center;
    font-size: 18px;
    line-height: 1.6;
  ">
    <p style="font-weight:bold; font-size:20px;">ご利用にあたって</p>
    <p id="noticeText"></p>
    <button id="noticeOk" style="
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 18px;
      border-radius: 8px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    ">OK</button>
  </div>
</div>

<script>

// ★ standalone 判定（固定）
const isStandalone = window.matchMedia('(display-mode: standalone)').matches;

// ★ 注意事項ダイアログ表示（OK後に mainapp へ）
function showNotice(message, nextUrl) {
  const dialog = document.getElementById("noticeDialog");
  const text = document.getElementById("noticeText");

  text.innerHTML = message;
  dialog.style.display = "flex";

  document.getElementById("noticeOk").onclick = function() {
    dialog.style.display = "none";
    location.replace(nextUrl);   // ★ OK後に mainapp へ
  };
}

// ★ 通常処理
function proceedNormal() {

  // ブラウザ起動 → インストール案内
  if (!isStandalone) {
    if (!localStorage.getItem("installed")) {
      document.getElementById("installPrompt").style.display = "flex";
    }

    document.getElementById("okButton").onclick = function() {
      document.getElementById("installPrompt").style.display = "none";
      document.getElementById("howToAdd").style.display = "block";
      localStorage.setItem("installed", "true");
    };
  }

  // ホーム画面起動 → config.json を読み、notice があれば表示
  if (isStandalone) {
    fetch("https://johokucong.github.io/config.json?nocache=" + Date.now())
      .then(res => res.json())
      .then(cfg => {

        // ★ notice があるときだけ表示して、OK後に mainapp へ
        if (cfg.notice) {
          showNotice(cfg.notice, cfg.mainapp);
          return; // ★ 即ジャンプを防ぐ
        }

        // notice がない場合は即ジャンプ
        location.replace(cfg.mainapp);
      })
      .catch(() => {
        alert("最新のアプリURLを取得できませんでした");
      });
  }
}

// ★ 即実行
proceedNormal();

</script>

</body>
</html>
