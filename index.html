<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">

<title>入口アプリ</title>
</head>

<body>

<!-- 初回だけ表示する案内UI -->
<div id="installPrompt" style="
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9998;
">
  <div style="
    background: white;
    padding: 20px;
    border-radius: 12px;
    width: 80%;
    max-width: 320px;
    text-align: center;
    font-size: 18px;
  ">
    <p>このアプリをホーム画面に追加できます。</p>
    <button id="okButton" style="
      padding: 10px 20px;
      font-size: 18px;
      border-radius: 8px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    ">OK</button>
  </div>
</div>

<!-- ホーム画面追加の説明 -->
<div id="howToAdd" style="
  display: none;
  padding: 20px;
  font-size: 18px;
  text-align: center;
">
  <p>この状態でホーム画面に追加できます</p>
  <p>追加したら一旦閉じてアイコンの出来上がりです</p>
</div>

<script>

// ★ standalone 判定（固定）
const isStandalone = window.matchMedia('(display-mode: standalone)').matches;

// ★ 通常処理（シンプル版）
function proceedNormal() {

  // ブラウザ起動 → インストール案内
  if (!isStandalone) {
    if (!localStorage.getItem("installed")) {
      document.getElementById("installPrompt").style.display = "flex";
    }

    document.getElementById("okButton").onclick = function() {
      document.getElementById("installPrompt").style.display = "none";
      document.getElementById("howToAdd").style.display = "block";
      localStorage.setItem("installed", "true");
    };
  }

  // ホーム画面起動 → mainapp に即ジャンプ
  if (isStandalone) {
    fetch("https://johokucong.github.io/config.json?nocache=" + Date.now())
      .then(res => res.json())
      .then(cfg => {
        location.replace(cfg.mainapp);
      })
      .catch(() => {
        alert("最新のアプリURLを取得できませんでした");
      });
  }
}

// ★ 即実行
proceedNormal();

</script>

</body>
</html>
