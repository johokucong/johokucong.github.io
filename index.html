<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">

<title>入口アプリ</title>
</head>

<body>

<!-- 工事中 + 暗証番号入力 -->
<div id="lockScreen" style="
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:#f0f0f0;
  z-index:9999;
  padding-top:80px;
  text-align:center;
  font-size:20px;
">
  <p>現在工事中です</p>
  <p>暗証番号を入力してください</p>
  <input id="passInput" type="password" style="font-size:22px; padding:8px;">
  <button id="passBtn" style="font-size:20px; padding:8px 20px;">OK</button>
  <p id="passError" style="color:red; display:none;">暗証番号が違います</p>
</div>

<!-- 初回だけ表示する案内UI -->
<div id="installPrompt" style="
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9998;
">
  <div style="
    background: white;
    padding: 20px;
    border-radius: 12px;
    width: 80%;
    max-width: 320px;
    text-align: center;
    font-size: 18px;
  ">
    <p>このアプリをホーム画面に追加できます。</p>
    <button id="okButton" style="
      padding: 10px 20px;
      font-size: 18px;
      border-radius: 8px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    ">OK</button>
  </div>
</div>

<!-- ホーム画面追加の説明 -->
<div id="howToAdd" style="
  display: none;
  padding: 20px;
  font-size: 18px;
  text-align: center;
">
  <p>この状態でホーム画面に追加できます</p>
  <p>追加したら一旦閉じてアイコンの出来上がりです</p>
</div>

<script>
// ===============================
// ★ ロック期間（日時指定）
// ===============================
function isLockedPeriod() {
  const now = new Date();

  // 8/12 20:00 〜 8/15 7:00
  const start = new Date("2026-08-11T00:20:00");
  const end   = new Date("2026-08-15T07:00:00");

  return now >= start && now <= end;
}

const PASSCODE = "274"; // 暗証番号
const isStandalone = window.matchMedia('(display-mode: standalone)').matches;


// ===============================
// ★ 通常処理（真っ白問題修正版）
// ===============================
function proceedNormal() {

  if (!isStandalone) {
      if (!localStorage.getItem("installed")) {
        document.getElementById("installPrompt").style.display = "flex";
      }

      document.getElementById("okButton").onclick = function() {
        document.getElementById("installPrompt").style.display = "none";
        document.getElementById("howToAdd").style.display = "block";
        localStorage.setItem("installed", "true");
      };
  }

  // ★ DOMContentLoaded を使わず即実行（重要）
  if (isStandalone) {
      fetch("https://johokucong.github.io/config.json?nocache=" + Date.now())
          .then(res => res.json())
          .then(cfg => {
              location.replace(cfg.mainapp);
          })
          .catch(() => {
              alert("最新のアプリURLを取得できませんでした");
          });
  }
}


// ===============================
// ★ 入口処理：まずロック判定
// ===============================
if (isLockedPeriod()) {

  document.getElementById("lockScreen").style.display = "block";

  document.getElementById("passBtn").onclick = function() {
    const v = document.getElementById("passInput").value;
    if (v === PASSCODE) {
      document.getElementById("lockScreen").style.display = "none";
      proceedNormal();   // 正解 → 通常処理へ
    } else {
      document.getElementById("passError").style.display = "block";
    }
  };

} else {
  proceedNormal();
}

</script>

</body>
</html>
